# Identifications attendues sur les captures réelles (tools/captures_reelles.py rapport).
# Chaque valeur doit figurer (sous-chaîne, sans casse) dans l'attribut de l'actif ;
# « !valeur » : ne doit PAS y figurer (faux positif corrigé, à ne pas réintroduire).
#
# Vérité terrain : ce que l'équipement dit de lui-même dans la capture (sysDescr SNMP,
# certificat, bannière, identité CIP / S7), recoupé quand c'est possible.

captures:
  # Lab 4SICS 2015 (Stockholm), logs Zeek d'origine
  4sics-151021-logs:
    192.168.88.60: { vendor: Moxa, role: Modbus }                 # certificat et bannière SSH Moxa
    192.168.88.61: { vendor: Moxa }
    192.168.88.75: { vendor: Hirschmann, model: Eagle, os_family: VxWorks }   # certificat EAGLE, IPSSH
    192.168.88.95: { vendor: RUGGEDCOM, role: [Modbus, DNP3] }    # certificat Ruggedcom
    192.168.88.115: { vendor: Digi, model: Digi CM }              # certificat « Digi CM »
    10.10.10.10: { device_type: Automate, role: "!Balayage" }     # automate S7, capture asymétrique
    192.168.2.42: { role: [Nmap, Balayage] }
    192.168.2.53: { role: [Balayage, "!DNP3"] }                   # balayage, pas un maître DNP3
    192.168.2.64: { role: [Balayage, "!DNP3"] }
    192.168.2.88: { role: [Balayage, "!DNP3"] }
    192.168.2.111: { role: [Balayage, "!DNP3"] }
