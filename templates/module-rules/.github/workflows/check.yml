name: Vérification du module

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer Auspex
        run: pip install "git+https://github.com/Jezu-CI/AUSPEX"
      - name: Vérifier le module
        run: auspex module check .
      - name: Le tag correspond à la version du manifeste
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import yaml; print(yaml.safe_load(open('module.yaml'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} ≠ version v$v"; exit 1; }
