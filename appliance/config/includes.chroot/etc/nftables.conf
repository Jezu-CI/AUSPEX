#!/usr/sbin/nft -f
# Pare-feu de démarrage du capteur Auspex : tout fermé (sauf boucle locale).
# Remplacé par auspex-parefeu une fois la configuration lue.
flush ruleset
table inet auspex {
    chain input   { type filter hook input priority 0; policy drop; iif lo accept; }
    chain output  { type filter hook output priority 0; policy drop; oif lo accept; }
    chain forward { type filter hook forward priority 0; policy drop; }
}
