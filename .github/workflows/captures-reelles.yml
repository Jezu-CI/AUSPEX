name: Captures réelles

# Captures industrielles publiques rejouées dans le vrai capteur (Zeek + ICSNPP),
# puis identification par Auspex comparée aux attendus (jalon J2–J3).
on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "sensor/**"
      - "src/auspex/fingerprint/**"
      - "src/auspex/zeek.py"
      - "tools/captures*"
      - "requirements/execution.txt"
      - ".github/workflows/captures-reelles.yml"
  pull_request:
    paths:
      - "rules/**"
      - "sensor/**"
      - "src/auspex/fingerprint/**"
      - "tools/captures*"
      - "requirements/execution.txt"
  schedule:
    - cron: "17 3 * * 1"        # chaque lundi : le dépôt source et les parsers évoluent
  workflow_dispatch:

concurrency:
  group: captures-${{ github.ref }}
  # Sur une PR, une nouvelle poussée remplace l'exécution en cours ; sur main, chaque
  # exécution va au bout (sinon le badge du README affiche « failing » pour une annulation)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  captures:
    name: Captures industrielles publiques (vrai Zeek)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements/execution.txt -r requirements/construction.txt && pip install -q --no-deps --no-build-isolation -e .
      - name: Image du capteur
        run: |
          docker build -q -t auspex-sensor:ci sensor >/dev/null
          docker run --rm auspex-sensor:ci version
      - name: Téléchargement des captures (épinglées, SHA-256 vérifiés)
        run: |
          git lfs version
          python tools/captures_reelles.py telecharger corpus
      - name: Le capteur lit chaque capture (réseau coupé, lecture seule)
        run: python tools/captures_reelles.py zeek corpus auspex-sensor:ci
      - name: Indices observés et identifications attendues
        run: |
          set -o pipefail
          python tools/captures_reelles.py rapport corpus | tee rapport.txt
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-reelles-rapport
          path: rapport.txt
          retention-days: 30
