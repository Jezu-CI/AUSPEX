# Relevé hebdomadaire des statistiques de ce dépôt (GitHub n'en garde que 14 jours),
# versionné dans un dépôt privé. Les chiffres ne figurent jamais dans le journal public
# de ce workflow : ils ne sont écrits que dans le dépôt privé.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   STATS_TOKEN       jeton fine-grained : Administration en lecture sur ce dépôt
#                     (exigée par l'API de trafic), Contents en écriture sur le dépôt privé
#   STATS_DEPOT_PRIVE  nom du dépôt privé (propriétaire/nom), qui contient
#                     tools/statistiques.py et le dossier statistiques/
name: Statistiques

on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi, 6 h 17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistiques
  cancel-in-progress: false

jobs:
  releve:
    if: github.repository == 'Jezu-CI/AUSPEX'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ secrets.STATS_DEPOT_PRIVE }}
          token: ${{ secrets.STATS_TOKEN }}
          persist-credentials: false
      - name: Relevé (aucun chiffre dans le journal)
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_DISCRET: "1"
        run: python3 tools/statistiques.py statistiques
      - name: Enregistrer dans le dépôt privé
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          DEPOT_PRIVE: ${{ secrets.STATS_DEPOT_PRIVE }}
        run: |
          git add statistiques
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git -c user.name="auspex-statistiques" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Statistiques du $(date -u +%F)"
          git push -q "https://x-access-token:${STATS_TOKEN}@github.com/${DEPOT_PRIVE}.git" HEAD:main
          echo "Relevé enregistré"
