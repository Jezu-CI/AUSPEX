# Vidéo de démonstration d'Auspex, filmée sur un vrai central chargé du scénario de
# démonstration (à lancer à la main). Résultat en artefact : auspex-demo.mp4 et son
# image d'aperçu, à relire avant de les publier sur le site.
name: Vidéo de démonstration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      A: docker compose exec -T auspex auspex -c /etc/auspex/auspex.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Données de démonstration
        run: |
          python examples/demo/generate_logs.py deploy/logs
          mkdir -p deploy/config
          cp examples/demo/regles-flux.csv deploy/config/regles-flux.csv
      - name: Installation du central
        working-directory: deploy
        env:
          AUSPEX_INTERVAL: "20"
        run: |
          ./install.sh
          for i in $(seq 1 60); do $A health && break; sleep 10; done
      - name: Navigateur
        run: |
          pip install -q --require-hashes -r requirements/captures.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Tournage
        working-directory: deploy
        run: python ../tools/demo_video.py
      - name: Conversion en MP4 et image d'aperçu
        if: always() && hashFiles('deploy/demo/auspex-demo.webm') != ''
        working-directory: deploy/demo
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -loglevel error -y -i auspex-demo.webm -c:v libx264 -preset veryfast -crf 26 \
            -pix_fmt yuv420p -movflags +faststart -an auspex-demo.mp4
          ffmpeg -loglevel error -y -ss 20 -i auspex-demo.mp4 -frames:v 1 -q:v 3 auspex-demo-apercu.jpg || true
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: video-demonstration
          path: |
            deploy/demo/auspex-demo.mp4
            deploy/demo/auspex-demo-apercu.jpg
            deploy/demo/erreur.png
          if-no-files-found: ignore
          retention-days: 14
