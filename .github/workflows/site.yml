# Site web du projet (GitHub Pages) : https://jezu-ci.github.io/AUSPEX/
# Activation, une seule fois : Settings → Pages → Source « GitHub Actions ».
name: Site web

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - THIRD-PARTY.md
      - mkdocs.yml
      - tools/site.py
      - requirements/site.txt
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Outils (MkDocs 1.x, Material 9.x)
        run: pip install --require-hashes -r requirements/site.txt
      - name: Construire (liens vérifiés)
        run: python tools/site.py --build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
