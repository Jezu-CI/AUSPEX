# Site web du projet (GitHub Pages) : https://jezu-ci.github.io/AUSPEX/
# Activation, une seule fois : Settings → Pages → Source « GitHub Actions ».
name: Site web

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - THIRD-PARTY.md
      - mkdocs.yml
      - tools/site.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Outils (MkDocs 1.x, Material 9.x)
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - name: Construire (liens vérifiés)
        run: python tools/site.py --build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
