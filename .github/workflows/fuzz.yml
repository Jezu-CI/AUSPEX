# Fuzzing des analyseurs qui lisent des données venues de l'extérieur (fuzz/cibles.py) :
# manifeste de mise à jour, journaux des capteurs (bruts ou compressés), règles de flux
# (CSV, Excel, champs), configuration, moteur d'identification, clé publique d'un capteur,
# archive de sauvegarde, réponses de NetBox. Chaque semaine et à la demande. Un plantage
# ou une entrée trop lente (fuzz/fuzz.py : LENTEUR) fait échouer le workflow ; l'entrée
# fautive est jointe en artefact.
name: Fuzzing

on:
  schedule:
    - cron: "23 3 * * 6"   # chaque samedi, 3 h 23 UTC
  workflow_dispatch:
    inputs:
      secondes:
        description: Durée par cible (secondes)
        default: "120"

permissions:
  contents: read

concurrency:
  group: fuzzing
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Dépendances du produit
        run: pip install --require-hashes -r requirements/execution.txt
      - name: Fuzzing de chaque cible
        env:
          SECONDES: ${{ inputs.secondes || '120' }}
        run: python fuzz/fuzz.py --toutes "$SECONDES"
      - name: Entrées fautives
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: plantages-fuzzing
          path: fuzz/plantages/
          if-no-files-found: ignore
