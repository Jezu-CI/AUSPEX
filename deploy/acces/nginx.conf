# Front HTTPS du central Auspex. Gabarit : @@HTTPS_SUFFIX@@ est remplacé au démarrage.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 50m;

    log_format auspex escape=json '{"time":"$time_iso8601","client":"$remote_addr","host":"$http_host",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,"carte":"$ssl_client_verify",'
        '"carte_sujet":"$ssl_client_s_dn","carte_serie":"$ssl_client_serial"}';
    access_log /dev/stdout auspex;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_certificate /etc/auspex-front/serveur.crt;
    ssl_certificate_key /etc/auspex-front/serveur.key;

    upstream netbox { server netbox:8080; }

    # Site principal : jamais d'en-tête de carte venu du client (effacés).
    server {
        listen 8443 ssl;
        http2 on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        location / {
            proxy_pass http://netbox;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Auspex-Proxy "";
            proxy_set_header X-Auspex-Carte "";
            proxy_set_header X-Auspex-Carte-Verif "";
            proxy_read_timeout 300s;
        }
    }

    # Port carte à puce (bloc écrit par Auspex depuis auth.carte, vide sinon).
    include /tmp/carte.conf;
}
