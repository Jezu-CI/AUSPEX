# Site web du projet : python tools/site.py --build (sources assemblées dans build/site-src)
site_name: Auspex
site_description: "Auspex, CMDB open source et passive pour l'IT et l'OT : inventaire des actifs et contrôle de la segmentation réseau par écoute passive, sans agent, avec NetBox et Zeek. Preuves NIS2, DORA, IEC 62443."
site_url: https://jezu-ci.github.io/AUSPEX/
repo_url: https://github.com/Jezu-CI/AUSPEX
repo_name: Jezu-CI/AUSPEX
edit_uri: ""
copyright: 'Auspex — concept de Yann Mathon · licence AGPL v3 · basé sur NetBox Community (Apache 2.0) · <a href="/AUSPEX/mentions-legales/">Mentions légales</a> · <a href="/AUSPEX/confidentialite/">Confidentialité (aucun cookie)</a>'
docs_dir: build/site-src
site_dir: build/site

theme:
  name: material
  custom_dir: overrides
  # Polices du système : aucune requête vers Google Fonts (confidentialité des visiteurs)
  font: false
  language: fr
  logo: assets/auspex-icon.svg
  favicon: assets/auspex-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Mode sombre }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Mode clair }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Vérification de propriété (Google Search Console, Bing Webmaster Tools) :
# coller ici le code fourni par chaque outil (méthode « balise HTML »).
extra:
  verification:
    google: "0pBErC9t88SAE8dKyzBiPwGvyBGDK4e86Kzn9XaTHUk"
    bing: ""
  css: !ENV [AUSPEX_CSS, "assets/auspex.css"]

# Feuille de style du site : nom avec empreinte du contenu (tools/site.py), pour qu'un
# navigateur ne garde jamais une ancienne version en cache (voir overrides/main.html)

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Ancres comme GitHub (accents conservés) : les liens fonctionnent aux deux endroits
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Accueil: index.md
  - Télécharger: telecharger.md
  - Guide utilisateur:
      - utilisateur/index.md
      - Les notions à connaître: utilisateur/notions.md
      - Mettre Auspex en route: utilisateur/mise-en-route.md
      - Se connecter: utilisateur/connexion.md
      - Le tableau de bord: utilisateur/tableau-de-bord.md
      - Comprendre les écarts: utilisateur/ecarts.md
      - La carte des actifs: utilisateur/carte.md
      - L'inventaire dans NetBox: utilisateur/inventaire.md
      - Déclarer les flux autorisés: utilisateur/regles-de-flux.md
      - Installer un capteur: utilisateur/capteurs.md
      - Recevoir les alertes: utilisateur/alertes.md
      - Les rapports d'audit: utilisateur/audits.md
      - Au quotidien: utilisateur/quotidien.md
  - Captures d'écran: captures.md
  - Questions fréquentes: faq.md
  - Guide technique: guide.md
  - Documentation:
      - documentation/index.md
      - Authentification et accès: documentation/01-authentification.md
      - Capteurs: documentation/02-capteur.md
      - Exports d'audit: documentation/03-audits.md
      - Exploitation: documentation/04-exploitation.md
      - Référence de configuration: documentation/05-configuration.md
      - Preuves automatisées: documentation/06-preuves-ci.md
  - Projet:
      - Versions: versions.md
      - Sécurité: securite.md
      - Composants tiers: composants-tiers.md
      - À propos: a-propos.md
      - Mentions légales: mentions-legales.md
      - Confidentialité: confidentialite.md
      - In English: en/index.md
