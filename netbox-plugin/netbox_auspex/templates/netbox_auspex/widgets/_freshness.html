{% if fresh.missing %}
  <div class="alert alert-warning mb-2 py-2" role="alert">Aucune donnée du service Auspex pour l'instant (premier cycle en cours, ou service arrêté).</div>
{% elif fresh.stale %}
  <div class="alert alert-danger mb-2 py-2" role="alert">Données de il y a {{ fresh.age_minutes }} min : le service Auspex ne les met plus à jour.</div>
{% endif %}
